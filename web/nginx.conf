server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed asset filenames, so those files are immutable and
  # can be cached hard. index.html must NOT be: it is the document that names
  # the current hashes. Cached, a returning visitor keeps requesting the hashes
  # from the build they saw last, which no longer exist on disk after a deploy —
  # the classic white screen with 404s in the console.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Client-side routing: an unknown path is a route for React Router to resolve,
  # not a 404 from nginx. Served with index.html's no-cache policy above.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # The API sets its own headers via helmet; these cover the static document.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # An unhandled request must not leak the server version.
  server_tokens off;
}
